<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#eef1f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef1f5; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(16,24,40,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#1b3a5c; padding:24px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-size:18px; font-weight:700; color:#ffffff; letter-spacing:0.3px;">
                    {{ app_name }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Accent bar -->
          <tr>
            <td style="height:4px; background-color:#64aef2; line-height:4px; font-size:0;">&nbsp;</td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 12px; font-size:20px; line-height:28px; color:#101828; font-weight:700;">
                {{ title }}
              </h1>
              {% if body %}
              <p style="margin:0 0 24px; font-size:15px; line-height:24px; color:#475467;">
                {{ body }}
              </p>
              {% endif %}

              {% if cta_url %}
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-radius:8px; background-color:#64aef2;">
                    <a href="{{ cta_url }}" target="_blank" style="display:inline-block; padding:12px 24px; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px;">
                      View in {{ app_name }}
                    </a>
                  </td>
                </tr>
              </table>
              {% endif %}
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 32px;">
              <div style="border-top:1px solid #eaecf0;"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px 28px;">
              <p style="margin:0; font-size:12px; line-height:18px; color:#98a2b3;">
                You're receiving this because email notifications are enabled for this event.
                {% if preferences_url %}
                <a href="{{ preferences_url }}" style="color:#64aef2; text-decoration:none;">Manage notification preferences</a>
                {% endif %}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
